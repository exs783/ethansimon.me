<style>
:root{
  --color-bg:#f3f2f2; --color-text:#201e1d;
  --color-accent:#ec3013;
  --color-divider:color-mix(in srgb, #201e1d 40%, transparent);
  --color-neutral-600:#605d5d; --color-neutral-900:#2d2b2b;
  --font-heading:"Archivo", system-ui, sans-serif;
  --space-3:12px; --space-4:16px; --space-6:24px;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-heading);font-size:15px;line-height:1.55}
a{color:inherit}
a:hover{color:var(--color-accent)}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
.nav{display:flex;align-items:center;padding:12px clamp(20px,5vw,64px);border-bottom:2px solid var(--color-divider)}
.nav-brand{font-weight:800;font-size:17px;letter-spacing:-.01em;text-decoration:none}
.wrap{min-height:calc(100vh - 49px);display:flex;flex-direction:column;justify-content:center;
  padding:clamp(48px,9vw,110px) clamp(20px,5vw,64px);max-width:640px}
h6{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-600);margin:0 0 var(--space-3);font-weight:800}
h1{font-size:clamp(30px,5vw,48px);font-weight:800;letter-spacing:-.015em;margin:0 0 var(--space-4)}
p{max-width:52ch;opacity:.85;margin:0 0 var(--space-6)}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:800;font-size:14px;
  color:var(--color-bg);background:var(--color-neutral-900);border:1px solid var(--color-neutral-900);
  padding:10px 16px;border-radius:0}
.btn:hover{background:#444141;color:var(--color-bg)}
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-brand" href="/">ETHAN SIMON</a>
</nav>

<div class="wrap">
  <h6>404</h6>

  <p>The link you followed is broken or the page has moved. Head back to the homepage to find the projects, skills, and contact info.</p>
  <div><a class="btn" href="/">Back to homepage →</a></div>
</div>
